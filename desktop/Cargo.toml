[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/statewave/statewave-admin"
rust-version = "1.78"

[workspace.dependencies]
# error handling
anyhow = "1"
thiserror = "1"

# async runtime + http
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip"] }
url = "2"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# crypto (mirrors src/lib/swmem.ts: PBKDF2-SHA256(600k) + AES-256-GCM)
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# config + secrets
directories = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# CLI ergonomics
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
inquire = "0.7"
comfy-table = "7"
console = "0.15"
nu-ansi-term = "0.50"
fuzzy-matcher = "0.3"
indicatif = "0.17"

# misc
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "z"

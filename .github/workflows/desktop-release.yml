name: desktop-release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag suffix to use for a manual run (e.g. desktop-v0.1.0-test)"
        required: true
        default: desktop-v0.0.0-manual

# A draft release is created by tauri-action and the standalone CLI is
# attached to the same release. Keep `permissions.contents: write` so the
# upload step can write release assets.
permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }} / ${{ matrix.rust_target }})
    strategy:
      fail-fast: false
      # Intel Mac (`x86_64-apple-darwin`, runs on `macos-13`) is intentionally
      # not built. Apple stopped selling Intel Macs in 2023, GitHub's
      # macos-13 runner pool is chronically backed up, and Rosetta 2 runs
      # the Apple Silicon `.dmg` natively — see the README's Desktop
      # section for the Intel-Mac install instructions.
      matrix:
        include:
          - platform: macos-latest
            os_family: macos
            rust_target: aarch64-apple-darwin
            cli_suffix: macos-arm64
          # Pinned to the oldest still-supported Ubuntu LTS on purpose. A
          # binary links against the glibc it was built on and cannot run on
          # anything older, so building on ubuntu-latest (24.04, glibc 2.39)
          # produced an AppImage that refused to start anywhere older with
          # "GLIBC_2.39 not found". 22.04 gives glibc 2.35 and is supported
          # until April 2027. Steps gate on os_family rather than this value
          # so the image can be moved again without silently skipping them.
          - platform: ubuntu-22.04
            os_family: linux
            rust_target: x86_64-unknown-linux-gnu
            cli_suffix: linux-x64
          - platform: windows-latest
            os_family: windows
            rust_target: x86_64-pc-windows-msvc
            cli_suffix: windows-x64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # ── Linux WebKit / GTK deps for the Tauri WebView. Mac and Windows
      #    have everything they need preinstalled on GitHub runners.
      - name: Install Linux build prerequisites
        if: matrix.os_family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # ── Bun: compiles the Node admin server (server/index.ts) into the
      #    sidecar binary that Tauri bundles into each .app/.exe/.AppImage.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Install npm deps
        run: npm ci

      - name: Build React frontend
        run: npm run build:client

      # ── Sidecar: compiled per matrix entry to match the Rust target
      #    triple, so Tauri's `externalBin` resolver picks the right
      #    binary for each platform.
      - name: Build sidecar (admin server) for ${{ matrix.rust_target }}
        shell: bash
        run: bash desktop/scripts/build-sidecar.sh --target ${{ matrix.rust_target }}

      - name: cargo test (core)
        working-directory: desktop
        run: cargo test -p statewave-admin-core --lib --target ${{ matrix.rust_target }}

      - name: Build CLI (release)
        working-directory: desktop
        run: cargo build -p statewave-admin-cli --release --target ${{ matrix.rust_target }}

      # ── Compute a clean version label by stripping the `desktop-` tag
      #    prefix, so the release title reads "Statewave Admin v0.1.0 —
      #    Desktop + CLI" instead of "Statewave Admin Desktop
      #    desktop-v0.1.0".
      - name: Compute release version label
        id: version
        shell: bash
        run: |
          # On a tag push the label comes from the tag. On a manual run
          # GITHUB_REF_NAME is the branch ("main"), so use the input instead.
          ref="${{ github.event.inputs.version || github.ref_name }}"
          echo "label=${ref#desktop-}" >> "$GITHUB_OUTPUT"

      # ── Tauri bundles. The desktop app is distributed exclusively
      #    via GitHub releases (no App Store / Microsoft Store), so we
      #    ship unsigned bundles. First-launch Gatekeeper / SmartScreen
      #    workarounds are documented in the top-level README.
      - name: Build GUI bundles (Tauri)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/crates/gui
          # Omitting tagName/releaseName makes tauri-action build without
          # creating or uploading to a release, which is what a manual run
          # wants: it exercises the bundle and the permission checks below
          # without publishing anything. Previously a manual run passed
          # github.ref_name, so it would have opened a draft release tagged
          # "main".
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('Statewave Admin {0} — Desktop + CLI', steps.version.outputs.label) || '' }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust_target }}

      # ─────────────────────────────────────────────────────────────
      # Post-build artifact smoke tests
      #
      # Boots each built bundle for a few seconds and checks the process
      # stays alive — catches "ships but crashes on launch" regressions
      # (e.g. missing WebView2 on Windows, missing GLib on Linux, a
      # broken sidecar path on macOS) that the build step itself can't
      # detect. The release stays in draft when these fail so a broken
      # set never becomes "latest".
      # ─────────────────────────────────────────────────────────────

      - name: Smoke-test built bundle (macOS)
        if: matrix.os_family == 'macos'
        shell: bash
        run: |
          APP="$GITHUB_WORKSPACE/desktop/target/${{ matrix.rust_target }}/release/bundle/macos/Statewave Admin.app"
          [ -d "$APP" ] || { echo "::error::missing $APP" ; exit 1 ; }
          "$APP/Contents/MacOS/statewave-admin-gui" > /tmp/swa-smoke.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then
            echo "✓ GUI process alive after 8s (pid=$PID)"
            kill $PID || true
          else
            echo "::error::GUI process died within 8s"
            cat /tmp/swa-smoke.log
            exit 1
          fi
          CLI="$GITHUB_WORKSPACE/desktop/target/${{ matrix.rust_target }}/release/statewave-admin"
          "$CLI" --version
          "$CLI" --help > /dev/null && echo "✓ CLI --help runs"

      # ─────────────────────────────────────────────────────────────
      # Normalize permissions inside the AppImage.
      #
      # linuxdeploy emits AppRun.wrapped as 0770. Inside a mounted
      # AppImage every file keeps the ownership it was packaged with
      # (root), so a mode with no "other" bits means the invoking user
      # cannot execute it: the app dies on launch with
      #   AppRun: line 12: AppRun.wrapped: Permission denied
      #
      # This is invisible to --appimage-extract-and-run, which unpacks
      # as the current user so the owner bits still apply. That is how a
      # green smoke test shipped a 1.2.1 AppImage that could not start
      # for anyone, and why the smoke test below no longer relies on it.
      # ─────────────────────────────────────────────────────────────
      - name: Normalize AppImage permissions (Linux)
        if: matrix.os_family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$GITHUB_WORKSPACE/desktop/target/${{ matrix.rust_target }}/release/bundle/appimage"
          APPIMAGE=$(ls "$BUNDLE"/*.AppImage | head -1)
          [ -n "$APPIMAGE" ] || { echo "::error::no AppImage produced" ; exit 1 ; }
          chmod +x "$APPIMAGE"

          work=$(mktemp -d)
          ( cd "$work" && "$APPIMAGE" --appimage-extract >/dev/null )

          # Readable by all; executable by all wherever the owner can execute.
          chmod -R go+rX "$work/squashfs-root"
          for f in AppRun AppRun.wrapped; do
            [ -e "$work/squashfs-root/$f" ] && chmod 0755 "$work/squashfs-root/$f"
          done

          curl -fsSL -o "$work/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$work/appimagetool"
          ARCH=x86_64 "$work/appimagetool" --appimage-extract-and-run \
            "$work/squashfs-root" "$APPIMAGE.repacked" >/dev/null
          mv "$APPIMAGE.repacked" "$APPIMAGE"
          chmod +x "$APPIMAGE"
          rm -rf "$work"
          echo "repacked $APPIMAGE with normalized permissions"

      # Assert the bug cannot come back. Reads the modes straight out of
      # the packaged squashfs, so it does not depend on how the image is
      # launched.
      - name: Verify AppImage permissions (Linux)
        if: matrix.os_family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends squashfs-tools
          BUNDLE="$GITHUB_WORKSPACE/desktop/target/${{ matrix.rust_target }}/release/bundle/appimage"
          APPIMAGE=$(ls "$BUNDLE"/*.AppImage | head -1)
          offset=$("$APPIMAGE" --appimage-offset)
          work=$(mktemp -d)
          dd if="$APPIMAGE" of="$work/fs.squashfs" bs=1M skip="$offset" iflag=skip_bytes status=none

          # Any regular file the owner can execute must be executable by
          # others too, and everything must be world readable.
          # Flag any regular file the invoking user cannot read, or that
          # the owner can execute but others cannot. Verified against the
          # broken 1.2.1 image: flags AppRun.wrapped (0770) and nothing
          # else out of 271 entries.
          bad=$(unsquashfs -ll "$work/fs.squashfs" | awk '
            $1 ~ /^-/ {
              owner_x = substr($1, 4, 1)
              other_r = substr($1, 8, 1)
              other_x = substr($1, 10, 1)
              if ((owner_x == "x" && other_x != "x") || other_r != "r") print
            }')
          if [ -n "$bad" ]; then
            echo "::error::AppImage contains files the invoking user cannot read or execute"
            echo "$bad"
            exit 1
          fi
          echo "✓ AppImage permissions are world readable, executables world executable"
          rm -rf "$work"

      # tauri-action uploaded the pre-repack AppImage, so replace that
      # asset on the draft with the permission-corrected build.
      - name: Replace AppImage on the draft release (Linux)
        if: matrix.os_family == 'linux' && startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: desktop/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: true

      - name: Smoke-test built bundle (Linux)
        if: matrix.os_family == 'linux'
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          APPIMAGE=$(ls "$GITHUB_WORKSPACE"/desktop/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage | head -1)
          [ -n "$APPIMAGE" ] || { echo "::error::no AppImage produced" ; exit 1 ; }
          chmod +x "$APPIMAGE"
          # Run the AppImage the way a user does (FUSE mount), not with
          # --appimage-extract-and-run, which unpacks as the current user
          # and therefore cannot see a permissions bug like the one above.
          sudo apt-get install -y --no-install-recommends libfuse2
          xvfb-run -a "$APPIMAGE" > /tmp/swa-smoke.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then
            echo "✓ GUI process alive after 8s (pid=$PID)"
            kill $PID || true
          else
            echo "::error::GUI process died within 8s"
            cat /tmp/swa-smoke.log
            exit 1
          fi
          CLI="$GITHUB_WORKSPACE/desktop/target/${{ matrix.rust_target }}/release/statewave-admin"
          "$CLI" --version
          "$CLI" --help > /dev/null && echo "✓ CLI --help runs"

      - name: Smoke-test built bundle (Windows)
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Recurse -Path "$env:GITHUB_WORKSPACE\desktop\target\${{ matrix.rust_target }}\release\bundle\msi" -Filter *.msi | Select-Object -First 1
          if (-not $msi) { Write-Error "::error::no MSI produced"; exit 1 }
          Write-Host "installing $($msi.FullName)"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /quiet /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "::error::msiexec exit $($p.ExitCode)"; exit 1 }
          $exe = "${env:ProgramFiles}\Statewave Admin\statewave-admin-gui.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "::error::installed exe not found at $exe"
            Get-ChildItem "${env:ProgramFiles}\Statewave Admin" -Recurse | Out-Host
            exit 1
          }
          $proc = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if (-not $proc.HasExited) {
            Write-Host "✓ GUI process alive after 8s (pid=$($proc.Id))"
            Stop-Process -Id $proc.Id -Force
          } else {
            Write-Error "::error::GUI process exited with code $($proc.ExitCode) within 8s"
            exit 1
          }
          $cli = "$env:GITHUB_WORKSPACE\desktop\target\${{ matrix.rust_target }}\release\statewave-admin.exe"
          & $cli --version
          & $cli --help | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "✓ CLI --help runs" } else { exit 1 }

      # ── Attach the standalone CLI binary to the same draft release so
      #    users get every artifact (GUI + CLI) in one place. The
      #    `cli_suffix` per matrix entry gives the binary a platform name
      #    (e.g. `statewave-admin-cli-macos-arm64`) instead of the rust
      #    target triple — clearer for users browsing the releases page.
      - name: Stage CLI binary
        shell: bash
        working-directory: desktop
        run: |
          mkdir -p ../release-staging
          if [[ "${{ matrix.rust_target }}" == *windows* ]]; then
            cp "target/${{ matrix.rust_target }}/release/statewave-admin.exe" \
               "../release-staging/statewave-admin-cli-${{ matrix.cli_suffix }}.exe"
          else
            cp "target/${{ matrix.rust_target }}/release/statewave-admin" \
               "../release-staging/statewave-admin-cli-${{ matrix.cli_suffix }}"
          fi
          ls -lh ../release-staging/

      - name: Attach CLI binary to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release-staging/*
          fail_on_unmatched_files: false
